name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint · Type Check · Audit · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0   # CI에서 git hooks 비활성화

      - name: Lint
        run: npx eslint .   # --fix 없이 실행 — CI는 수정이 아닌 검사만 수행

      - name: Type check
        run: npx tsc --noEmit

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: npm test
