name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint · Type Check · Audit · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0   # CI에서 git hooks 비활성화

      - name: Lint
        run: npx eslint .   # --fix 없이 실행 — CI는 수정이 아닌 검사만 수행

      - name: Type check
        run: npx tsc --noEmit

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # tag.spec.ts는 태그 UI 미구현으로 Red 상태 — UI 구현 완료 후 파일 지정 제거
        run: npx playwright test e2e/notes.spec.ts
        env:
          CI: true

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
